<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Italianno&display=swap"
      rel="stylesheet"
    />
    <title>Season</title>
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }
      body {
        background-color: #000000;
        font-family: "Italianno";
        height: 1500px;
      }

      .topbar {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 100px;
        color: white;
        font-size: 36px;
        position: fixed;
        width: 100%;
      }

      .head {
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        padding-top: 40px;
        font-size: 100px;
        
      }

      .season:hover {
        color: rgb(156, 156, 156);
        transition: all 0.3s;
        cursor: pointer;
      }
      .profile {
        width: 1000px;
        height: 700px;
        border-radius: 50px;
        border: 5px solid white;
      }
      .abcd{
        display: flex;
        justify-content: center;
        align-items: center;
        color: rgb(255, 238, 219);
        gap: 200px;
        font-size: 28px;
        padding-top: 500px;
        position: fixed;
        width: 100%;

      }

      .back img {
        position: fixed;
        top: 0;
        left: 0;
        z-index: -999;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="container">
    <div class="topbar">
      <div class="season">Home</div>
      <div class="season">Spring🌸</div>
      <div class="season">Summer🌞</div>
      <div class="season">Fall🍂</div>
      <div class="season">Winter❄️</div>
    </div>

    <div class="head">Four Season</div>

    <div class="abcd">
    <div class="a">Blooming season</div>
    <div class="b">Hello, sunshine</div>
    <div class="c">Falling for Autumn.</div>
    <div class="d">Warm winter wishes.</div>
    </div>

    <div class="back">
      <img
        src="https://p4.wallpaperbetter.com/wallpaper/672/671/623/four-seasons-02-1920x1080-nature-seasons-hd-art-wallpaper-preview.jpg"
        alt=""
      />
    </div>
  </div>
  </body>
</html>
