<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Italianno&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap" rel="stylesheet">
    <title>Spring</title>
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }

      body {
        background-color: #525151;
        font-family: "Italianno";
        height: 1500px;
      }

      .head {
        color: rgb(255, 255, 255);
        display: flex;
        justify-content: center;
        align-items: center;
        padding-top: 20px;
        font-size: 96px;
      }

      .topbar {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 100px;
        color: white;
        font-size: 36px;
        position: fixed;
        width: 100vw;

      }

      .season:hover {
        color: rgb(255, 121, 121);
        transition: all 0.3s;
        cursor: pointer;
      }

      .icon-box {
        padding-top: 100px;
        text-align: center;
      }

      .profile {
        width: 600px;
        height: 600px;
        border-radius: 50%;
        border: 5px solid white;
        box-shadow:  0 0 20px rgb(255, 245, 201);
      }
      .text{
        color: white;
        font-size: 20px;
        font-family: "Nanum Brush Script";
        font-size: 32px;
      }

      .back img {
        position: fixed;
        top: 0;
        left: 0; 
        z-index: -9999;
        width: 100vw;
        height: 100vh;
        opacity: 0.7;
      }

    </style>
  </head>
  <body>

    <div class="topbar">
      <div class="season">Home</div>
      <div class="season">Spring🌸</div>
      <div class="season">Summer🌞</div>
      <div class="season">Fall🍂</div>
      <div class="season">Winter❄️</div>
    </div>

    <div class="icon-box">
      <div class="icon">
        <img 
        src="https://mediahub.seoul.go.kr/wp-content/uploads/2015/02/ec8056cf7e38460f6269f97c67163269.jpg"      
        alt="봄"
        class="profile"
      </div>
    </div>

    <div class="head">Spring</div>

    <div class="text">따스한 봄 기운처럼 활기차게 시작하세요</div>
      
    <div class="back">
      <img src="https://cdn.ardentnews.co.kr/news/photo/202402/2834_12859_3949.jpg"    
      alt="배경">
    </div>      
  </body>
</html>
