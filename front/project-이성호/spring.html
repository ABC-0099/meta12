    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }
      body {
        background-color: #525151;
        font-family: "Italianno";
        height: 1500px;
      }

      .head {
        color: rgb(255, 255, 255);
        display: flex;
        justify-content: center;
        align-items: center;
        padding-top: 20px;
        font-size: 96px;
      }

      .topbar {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 100px;
        color: white;
        font-size: 36px;
        position: fixed;
        width: 100vw;

      }

      .season:hover {
        color: rgb(124, 44, 44);
        transition: all 0.3s;
        cursor: pointer;
      }
      .icon-box {
  padding-top: 100px;
  text-align: center;
}
.profile {
  width: 700px;
  height: 700px;
  border-radius: 50%;
  border: 5px solid white;
}
.back img {
  position: fixed;
  top: 0;
  left: 0; 
  z-index: -9999;
  width: 100vw;
  height: 100vh;
  opacity: 0.7;
}

    </style>
