<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Italianno&display=swap"
      rel="stylesheet"
    />
    <title>Fall</title>
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }
      body {
        background-color: #000000;
        font-family: "Italianno";
        height: 1500px;
      }

      .head {
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        padding-top: 20px;
        font-size: 96px;
      }

      .topbar {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 100px;
        color: white;
        font-size: 36px;
        position: fixed;
        width: 100vw;

      }

      .season:hover {
        color: rgb(248, 168, 143);
        transition: all 0.3s;
        cursor: pointer;
      }
      .icon-box {
  padding-top: 100px;
  text-align: center;
}
.profile {
  width: 700px;
  height: 700px;
  border-radius: 50%;
  border: 5px solid white;
}
.back img{
    position: fixed;
    opacity: 0.8;
    top: 0;
    left: 0;
    z-index: -999;
    width: 100%;
    height: 100%;

}

    </style>
  </head>
  <body>
    
    <div class="topbar">
      <div class="season">Home</div>
      <div class="season">Spring</div>
      <div class="season">Summer</div>
      <div class="season">Fall</div>
      <div class="season">Winter</div>
    </div>

    <div class="icon-box">
      <div class="icon">
        <img 
      src="https://mediahub.seoul.go.kr/uploads/mediahub/2024/11/aHoAaPpMSZmKqWowcUJoHZOXHOydbZSc.jpg"
      alt="가을"
      class="profile"
      </div>
    </div>

     <div class="head">Fall</div>

    <div class="back">
      <img src="https://static.hanatour.com/product/2021/10/11/07584eajj4/default.jpg"        
      alt="배경">
    </div>
  </body>
</html>
