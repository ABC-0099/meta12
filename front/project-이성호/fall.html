<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Italianno&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap" rel="stylesheet">
    <title>Fall</title>
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }
      body {
        background-color: #000000;
        font-family: "Italianno";
        height: 1500px;
      }

      .head {
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        padding-top: 20px;
        font-size: 96px;
      }

      .topbar {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 100px;
        color: white;
        font-size: 36px;
        position: fixed;
        width: 100vw;

      }

      .season:hover {
        color: rgb(248, 168, 143);
        transition: all 0.3s;
        cursor: pointer;
      }
      .icon-box {
        padding-top: 100px;
        text-align: center;
      }
      .profile {
        width: 600px;
        height: 600px;
        border-radius: 50%;
        border: 5px solid white;
        box-shadow:  0 0 400px rgb(177, 41, 0);
      }
      .texthead{
        color: white;
        font-family: "Nanum Brush Script";
        font-size: 40px;
        padding-bottom: 10px;
        text-shadow: 0 0 20px rgb(255, 245, 201);
      }
      .text{
        color: white;
        font-family: "Nanum Brush Script";
        font-size: 30px;
        text-shadow: 0 0 20px rgb(255, 245, 201);
      }
      .back img{
        position: fixed;
        opacity: 0.8;
        top: 0;
        left: 0;
        z-index: -999;
        width: 100%;
        height: 100%;
      }
      a{
        text-decoration: none;
        color: white;
      }
    </style>
  </head>
  <body>
    
    <div class="topbar">
      <div class="season"><a href="season.html">Home</a></div>
        <div class="season"><a href="spring.html">Spring🌸</a></div>
        <div class="season"><a href="summer.html">Summer🌞</a></div>
        <div class="season"><a href="fall.html">Fall🍂</a></div>
        <div class="season"><a href="winter.html">Winter❄️</a></div>
    </div>

    <div class="icon-box">
      <div class="icon">
        <img 
      src="https://mediahub.seoul.go.kr/uploads/mediahub/2024/11/aHoAaPpMSZmKqWowcUJoHZOXHOydbZSc.jpg"
      alt="가을"
      class="profile"
      </div>
    </div>

     <div class="head">Fall</div>

    <div class="texthead">바람이 산뜻하게 불고, 낙엽이 황금빛으로 물드는 계절.</div>
    <div class="text">가을은 바람이 한결 가벼워지고 하늘이 높아지는 계절이다.
      <br>나무들은 천천히 색을 바꾸며 하루를 차분하게 물들인다.
      <br>그래서 가을은 마음을 조용히 쉬게 해 주는 시간이다.
    </div>


    <div class="back">
      <img src="https://static.hanatour.com/product/2021/10/11/07584eajj4/default.jpg"        
      alt="배경">
    </div>
  </body>
</html>
