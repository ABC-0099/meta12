    <style>
      * {

        margin: 0;

        height: 1500px;
      }

      .head {
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        padding-top: 20px;
        font-size: 96px;
      }

      .topbar {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 100px;
        color: white;
        font-size: 36px;
        position: fixed;
        width: 100vw;

      }

        color: rgb(248, 168, 143);
        transition: all 0.3s;
        cursor: pointer;
      }

  padding-top: 100px;
  text-align: center;
}
.profile {
  width: 700px;
  height: 700px;
  border-radius: 50%;
  border: 5px solid white;
}
.back img{
    position: fixed;
    opacity: 0.8;
    top: 0;
    left: 0;
    z-index: -999;
    width: 100%;
    height: 100%;

}
