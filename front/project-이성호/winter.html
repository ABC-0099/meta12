<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Italianno&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap" rel="stylesheet">
    <title>Winter</title>
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }
      body {
        background-color: #3d3a44;
        font-family: "Italianno";
        height: 1500px;
      }

      .head {
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        padding-top: 20px;
        font-size: 96px;
      }

      .topbar {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 100px;
        color: white;
        font-size: 36px;
        position: fixed;
        width: 100vw;
        

      }

      .season:hover {
        color: rgb(171, 143, 250);
        transition: all 0.3s;
        cursor: pointer;
      }
      .icon-box {
        padding-top: 100px;
        text-align: center;
      }
      .profile {
        width: 600px;
        height: 600px;
        border-radius: 50%;
        border: 5px solid white;
        box-shadow:  0 0 40px rgb(113, 215, 255);
      }
      .texthead{
        color: white;
        font-family: "Nanum Brush Script";
        font-size: 40px;
        padding-bottom: 10px;
        text-shadow: 0 0 20px rgb(255, 245, 201);
      }
      .text{
        color: white;
        font-family: "Nanum Brush Script";
        font-size: 30px;
        text-shadow: 0 0 20px rgb(255, 245, 201);
      }
      .back img{
          position: fixed;
          opacity: 0.8;
          top: 0;
          left: 0;
          z-index: -999;
          width: 100%;
          height: 100%;
      }


    </style>
  </head>
  <body>

    <div class="topbar">
      <div class="season">Home</div>
      <div class="season">Spring🌸</div>
      <div class="season">Summer🌞</div>
      <div class="season">Fall🍂</div>
      <div class="season">Winter❄️</div>
    </div>

    <div class="icon-box">
      <div class="icon">
      <img 
      src="https://hrcopinion.co.kr/wp-content/uploads/2023/04/iStock-1292222795.jpg"
      alt="겨울"
      class="profile"
      </div>
    </div>

      <div class="head">Winter</div>

       <div class="texthead">눈송이가 조용히 내려 세상을 포근하게 감싸는 계절.</div>
    <div class="text">겨울은 공기가 차가워지고 풍경이 조용해지는 계절이다.
      <br>차가운 바람이 볼을 스치지만, 따뜻한 차 한 잔과 함께라면 마음이 부드러워지죠.
      <br>밤이 길어 별빛이 반짝이는 겨울 하늘을 바라보며 작은 행복을 느낄 수 있는 시간이에요.
    </div>
    <div class="back">
      <img src="https://mediahub.seoul.go.kr/uploads/mediahub/2022/02/FRRbvcOYCqeVlRvbOhmCbPUebwHrKBoJ.jpg"        
      alt="배경">
    </div>
  </body>
</html>
