<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Italianno&display=swap"
      rel="stylesheet"
    />
    <title>Summer</title>
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }
      body {
        background-color: #686868;
        font-family: "Italianno";
        height: 1500px;
      }

      .head {
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        padding-top: 20px;
        font-size: 96px;
      }

      .topbar {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 100px;
        color: white;
        font-size: 36px;
        position: fixed;
        width: 100vw;

      }

      .season:hover {
        color: rgb(99, 94, 170);
        transition: all 0.3s;
        cursor: pointer;
      }
      .icon-box {
  padding-top: 100px;
  text-align: center;
}
.profile {
  width: 700px;
  height: 700px;
  border-radius: 50%;
  border: 5px solid white;
}
.back img{
    position: fixed;
    opacity: 0.8;
    top: 0;
    left: 0;
    z-index: -999;
    width: 100%;
    height: 100%;

}
    </style>
  </head>
  <body>
    
    <div class="topbar">
      <div class="season">Home</div>
      <div class="season">Spring🌸</div>
      <div class="season">Summer🌞</div>
      <div class="season">Fall🍂</div>
      <div class="season">Winter❄️</div>
    </div>

    <div class="icon-box">
      <div class="icon">
        <img
        src="https://img.freepik.com/free-photo/beautiful-tropical-beach_74190-1327.jpg?semt=ais_hybrid&w=740&q=80"
        alt="여름"
        class="profile"
      </div>
    </div>

      <div class="head">Summer</div>

    <div class="back">
        <img src="https://i.pinimg.com/1200x/5f/96/49/5f96498927c8b592c18dd87939af2d97.jpg"       
        alt="배경">
    </div>

  </body>
</html>
