<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Italianno&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap" rel="stylesheet">
    <title>Summer</title>
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }
      body {
        background-color: #686868;
        font-family: "Italianno";
        height: 1500px;
      }

      .head {
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        padding-top: 20px;
        font-size: 96px;
      }

      .topbar {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 100px;
        color: white;
        font-size: 36px;
        position: fixed;
        width: 100vw;

      }

      .season:hover {
        color: rgb(99, 94, 170);
        transition: all 0.3s;
        cursor: pointer;
      }

      .icon-box {
      padding-top: 100px;
      text-align: center;
      }

      .profile {
        width: 600px;
        height: 600px;
        border-radius: 50%;
        border: 5px solid white;
        box-shadow:  0 0 40px rgb(95, 164, 255);
      }

      .texthead{
        color: white;
        font-family: "Nanum Brush Script";
        font-size: 40px;
        padding-bottom: 10px;
        text-shadow: 0 0 20px rgb(255, 245, 201);
      }
      .text{
        color: white;
        font-family: "Nanum Brush Script";
        font-size: 30px;
        text-shadow: 0 0 20px rgb(255, 245, 201);
      }

      .back img{
        position: fixed;
        opacity: 0.8;
        top: 0;
        left: 0;
        z-index: -999;
        width: 100%;
        height: 100%;
        }
        a{
        text-decoration: none;
        color: white;
      }
    </style>
  </head>
  <body>
    
    <div class="topbar">
     <div class="season"><a href="season.html">Home</a></div>
        <div class="season"><a href="spring.html">Spring🌸</a></div>
        <div class="season"><a href="summer.html">Summer🌞</a></div>
        <div class="season"><a href="fall.html">Fall🍂</a></div>
        <div class="season"><a href="winter.html">Winter❄️</a></div>
    </div>

    <div class="icon-box">
      <div class="icon">
        <img
        src="https://img.freepik.com/free-photo/beautiful-tropical-beach_74190-1327.jpg?semt=ais_hybrid&w=740&q=80"
        alt="여름"
        class="profile"
      </div>
    </div>

      <div class="head">Summer</div>


      <div class="texthead">햇살이 가장 길고, 바다가 가장 빛나는 계절</div>
      <div class="text">여름은 기온이 높고 해가 길어요.
        <br>사람들은 바다나 산으로 휴가를 떠나며 야외 활동을 즐겨요.
        <br>매미 소리와 시원한 빙수처럼 여름만의 풍경이 있어요.</div>



    <div class="back">
        <img src="https://i.pinimg.com/1200x/5f/96/49/5f96498927c8b592c18dd87939af2d97.jpg"       
        alt="배경">
    </div>

  </body>
