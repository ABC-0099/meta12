<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        color: #333;
        background-color: #f4f4f4;
      }
      .container {
        width: 80%;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header {
        background-color: rgb(51, 61, 85);
        color: #fff;
        padding: 1rem 0;
      }
      header ul {
        display: flex;
        list-style: none;
        /* gap: 20px; */
      }
      header ul li {
        margin-left: 20px;
      }
      header a {
        color: white;
        text-decoration: none;
      }
      main {
        margin-top: 20px;
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .content {
        flex: 3;
        background-color: #e1e1e1;
        padding: 20px;
        border-radius: 8px;
        min-height: 300px;
      }
      .sidebar {
        flex: 1;
        background-color: #e1e1e1;
        padding: 20px;
        border-radius: 8px;
      }
      .box {
        margin-top: 20px;
        height: 100px;
        background-color: #3498db;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      main a {
        color: white;
        text-decoration: none;
      }
      footer {
        text-align: center;
        padding: 20px;
        background: #333;
        color: white;
        margin-top: 20px;
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    <header>
      <div class="container">
        <h1>MyClass</h1>

        <nav>
          <ul>
            <li><a href="#">홈</a></li>
            <li><a href="#">강의 소개</a></li>
            <li><a href="#">게시판</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="content">
        <h2>오늘의 학습주제 : 레이아웃</h2>
        <p>HTML 구조를 잡고 CSS flexbox를 이용해 배치하는 방법을 배웁니다.</p>
        <div class="box">컨텐츠 영역</div>
      </section>

      <aside class="sidebar">
        <h3>공지사항</h3>
        <ul>
          <li><a href="#">과제 제풀 기한 안내</a></li>
          <li><a href="#">준비물; 노트북, 열정</a></li>
        </ul>
      </aside>
    </main>

    <footer>
      <p>&copy; 2026 MyClass. All right reserved</p>
    </footer>
  </body>
</html>
