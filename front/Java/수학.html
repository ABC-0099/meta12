<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // seed 는 랜덤값의 범이를 결정
      // 배열의 랜덤 인덱스를 뽑는 경우 seed 대신 배열.length를 사용
      let seed = prompt("전체 응모자 수 : ");
      let picked = Math.floor(Math.random() * seed) + 1;
      document.write(`<p>전체 응모자 수 : ${seed}명`);
      document.write(`<p>당첨자 : ${picked}번`);
    </script>
  </body>
</html>
