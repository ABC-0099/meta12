    <!-- 16장 2번 문제 -->
     <h2> 3의 배수 찾기 </h2>
     <script>
        let num = parseInt(prompt("몇 까지3의 배수를 찾을까요?"));
        let count = 0;
        
        for(let i = 1; i <= num; i++){
            if(i % 3 === 0){
                document.write(`${i}, `);
                count++;
            }
        }
        document.write(`<br><br>${num}까지 3의 배수의 개수:${count} `);
     </script>
